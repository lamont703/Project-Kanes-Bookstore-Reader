<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#pageBg)" rx="4"/>
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="#3a3530" stroke-width="1" rx="2"/>
  <text x="60" y="100" font-family="Georgia, serif" font-size="18" fill="#d4cec2">The way we carried culture across the stars even</text>
  <text x="60" y="132" font-family="Georgia, serif" font-size="18" fill="#d4cec2">as refugees. They saw in humanity not just survivors,</text>
  <text x="60" y="164" font-family="Georgia, serif" font-size="18" fill="#d4cec2">but storytellers—and that, they said, was the rarest</text>
  <text x="60" y="196" font-family="Georgia, serif" font-size="18" fill="#d4cec2">thing in the universe.</text>
  <text x="60" y="228" font-family="Georgia, serif" font-size="18" fill="#d4cec2"></text>
  <text x="60" y="260" font-family="Georgia, serif" font-size="18" fill="#d4cec2"></text>
  <text x="60" y="292" font-family="Georgia, serif" font-size="18" fill="#d4cec2">                    — END OF PREVIEW —</text>
  <text x="50%" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8a8070">— 10 —</text>
</svg>