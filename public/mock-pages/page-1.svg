<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#pageBg)" rx="4"/>
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="#3a3530" stroke-width="1" rx="2"/>
  <text x="50%" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#e8e2d6">Chapter 1: The Awakening</text>
  <text x="60" y="140" font-family="Georgia, serif" font-size="18" fill="#d4cec2">The stars had always called to her. Even as a child,</text>
  <text x="60" y="172" font-family="Georgia, serif" font-size="18" fill="#d4cec2">Zara would spend countless nights on the observation</text>
  <text x="60" y="204" font-family="Georgia, serif" font-size="18" fill="#d4cec2">deck of the colony ship, watching the cosmos drift by</text>
  <text x="60" y="236" font-family="Georgia, serif" font-size="18" fill="#d4cec2">in an endless tapestry of light and shadow.</text>
  <text x="60" y="268" font-family="Georgia, serif" font-size="18" fill="#d4cec2"></text>
  <text x="60" y="300" font-family="Georgia, serif" font-size="18" fill="#d4cec2">Her parents had been among the first to sign up for</text>
  <text x="60" y="332" font-family="Georgia, serif" font-size="18" fill="#d4cec2">the Great Migration, leaving Earth behind for the</text>
  <text x="60" y="364" font-family="Georgia, serif" font-size="18" fill="#d4cec2">promise of new worlds. She couldn&apos;t remember much</text>
  <text x="60" y="396" font-family="Georgia, serif" font-size="18" fill="#d4cec2">of the old planet—just fragments of blue skies and</text>
  <text x="60" y="428" font-family="Georgia, serif" font-size="18" fill="#d4cec2">the scent of rain. Everything else was metal corridors</text>
  <text x="60" y="460" font-family="Georgia, serif" font-size="18" fill="#d4cec2">and recycled air.</text>
  <text x="50%" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8a8070">— 1 —</text>
</svg>