<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#pageBg)" rx="4"/>
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="#3a3530" stroke-width="1" rx="2"/>
  <text x="60" y="100" font-family="Georgia, serif" font-size="18" fill="#d4cec2">She&apos;d discovered something remarkable—the message</text>
  <text x="60" y="132" font-family="Georgia, serif" font-size="18" fill="#d4cec2">wasn&apos;t just a greeting, it was an invitation.</text>
  <text x="60" y="164" font-family="Georgia, serif" font-size="18" fill="#d4cec2"></text>
  <text x="60" y="196" font-family="Georgia, serif" font-size="18" fill="#d4cec2">The beings called themselves the Luminari, children</text>
  <text x="60" y="228" font-family="Georgia, serif" font-size="18" fill="#d4cec2">of the nebula, born from the energy storms that</text>
  <text x="60" y="260" font-family="Georgia, serif" font-size="18" fill="#d4cec2">raged within. They had no physical form as humans</text>
  <text x="60" y="292" font-family="Georgia, serif" font-size="18" fill="#d4cec2">understood it, existing as patterns of electromagnetic</text>
  <text x="60" y="324" font-family="Georgia, serif" font-size="18" fill="#d4cec2">radiation and thought.</text>
  <text x="50%" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8a8070">— 7 —</text>
</svg>