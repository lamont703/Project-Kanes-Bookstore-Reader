<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#pageBg)" rx="4"/>
  <rect x="30" y="30" width="540" height="740" fill="none" stroke="#3a3530" stroke-width="1" rx="2"/>
  <text x="60" y="100" font-family="Georgia, serif" font-size="18" fill="#d4cec2">Morrison&apos;s weathered face looked more tired than usual.</text>
  <text x="60" y="132" font-family="Georgia, serif" font-size="18" fill="#d4cec2">The weight of eight thousand souls pressed down on his</text>
  <text x="60" y="164" font-family="Georgia, serif" font-size="18" fill="#d4cec2">shoulders daily. &apos;Dr. Nebula,&apos; he said, using her</text>
  <text x="60" y="196" font-family="Georgia, serif" font-size="18" fill="#d4cec2">nickname, &apos;can you make sense of this?&apos;</text>
  <text x="60" y="228" font-family="Georgia, serif" font-size="18" fill="#d4cec2"></text>
  <text x="60" y="260" font-family="Georgia, serif" font-size="18" fill="#d4cec2">Zara stepped forward, her fingers dancing across the</text>
  <text x="60" y="292" font-family="Georgia, serif" font-size="18" fill="#d4cec2">holographic interface. The signal responded, shifting</text>
  <text x="60" y="324" font-family="Georgia, serif" font-size="18" fill="#d4cec2">and adapting to her inputs. It was alive, intelligent,</text>
  <text x="60" y="356" font-family="Georgia, serif" font-size="18" fill="#d4cec2">and it was trying to communicate.</text>
  <text x="50%" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8a8070">— 4 —</text>
</svg>